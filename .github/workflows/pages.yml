name: pages

# Builds the browser version of the map (public/) and publishes it to GitHub Pages.

on:
  push:
    branches: [main, dmitry.shit]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: install
        run: npm ci --ignore-scripts

      # public/js is build output and is not in git, so the renderer is compiled
      # from src/ on every deploy. The Electron main process is not needed here.
      - name: build renderer
        run: npx tsc -p tsconfig.renderer.json

      - name: configure pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: deploy
        id: deploy
        uses: actions/deploy-pages@v4
